<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kbrtp.top — BIG THINGS COMING SOON</title>
    <meta name="description" content="kbrtp.top - Big things coming soon. Invite required.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Blurred Ambient Background -->
    <div class="bg-blur-wrapper">
        <div class="blur-blob blob-1"></div>
        <div class="blur-blob blob-2"></div>
        <div class="blur-blob blob-3"></div>
        <div class="blur-overlay"></div>
    </div>

    <!-- Main Centered Stage (No edge text, no request invite) -->
    <main class="center-stage">
        <div class="glass-card">
            <h1 class="domain-title">kbrtp.top</h1>
            <h2 class="sub-title">BIG THINGS COMING SOON</h2>

            <!-- Invite Code Authentication Form -->
            <form id="invite-form" class="access-form">
                <div class="field-container">
                    <input 
                        type="text" 
                        id="invite-input" 
                        placeholder="ENTER INVITE CODE..." 
                        required
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button type="submit" class="access-btn">AUTHENTICATE</button>
                </div>
                <div id="access-status" class="status-msg"></div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
